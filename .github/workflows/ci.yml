# Builds the solution and runs the tests on GitHub's servers.
# A push to main that passes the tests is also deployed to Azure App Service.
name: CI

on:
  push:            # every push, on any branch
  pull_request:
    branches: [main]

env:
  AZURE_WEBAPP_NAME: taskmanagerle   # the App Service's name, as shown in the Azure portal

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore TaskManagerLE.sln

      - name: Build
        run: dotnet build TaskManagerLE.sln --no-restore --configuration Release

      # Two steps instead of one, so the Actions page shows which kind of test failed.
      # Unit tests run first: they're fast, and if they fail there's no point starting the whole app.
      - name: Unit tests
        run: dotnet test TaskManagerLE.Tests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test TaskManagerLE.IntegrationTests --no-build --configuration Release

      # Only pushes to main are deployed, so only they need the publish output.
      - name: Publish web app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish TaskManagerLE/TaskManagerLE.csproj --no-build --configuration Release --output ./publish

      # Jobs run on separate machines, so the files are handed to the deploy job as an "artifact".
      - name: Upload publish output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    # needs: the deploy job only starts if build-and-test passed, so failing tests block the deploy.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
